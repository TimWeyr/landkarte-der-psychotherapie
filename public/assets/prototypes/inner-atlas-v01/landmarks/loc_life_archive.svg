<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2d261e" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="grad-loc_life_archive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c68a35"/>
      <stop offset="100%" stop-color="#2d261e"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <!-- Base Circular Shield Badge -->
    <circle cx="256" cy="256" r="220" fill="#f6f1e8" stroke="#c68a35" stroke-width="12"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#ede4d3" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- Distinct Silhouette Icons -->
    
        <!-- Scroll Archive -->
        <rect x="176" y="200" width="160" height="170" fill="#f6f1e8" stroke="#2d261e" stroke-width="10"/>
        <line x1="176" y1="260" x2="336" y2="260" stroke="#2d261e" stroke-width="6"/>
        <line x1="176" y1="320" x2="336" y2="320" stroke="#2d261e" stroke-width="6"/>
        <!-- Scrolls -->
        <ellipse cx="216" cy="230" rx="20" ry="12" fill="#c68a35"/>
        <ellipse cx="296" cy="230" rx="20" ry="12" fill="#c68a35"/>
        <ellipse cx="256" cy="290" rx="24" ry="14" fill="#b25838"/>
        <polygon points="156,200 256,130 356,200" fill="#c68a35" stroke="#2d261e" stroke-width="8"/>
      

    <!-- Outer Decorative Compass Nodule -->
    <circle cx="256" cy="46" r="10" fill="#c68a35"/>
    <circle cx="256" cy="466" r="10" fill="#c68a35"/>
    <circle cx="46" cy="256" r="10" fill="#c68a35"/>
    <circle cx="466" cy="256" r="10" fill="#c68a35"/>
